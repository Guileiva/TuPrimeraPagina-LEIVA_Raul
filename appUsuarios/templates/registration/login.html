{% extends 'base.html' %}
{% load crispy_forms_tags %} 

{% block content_title %}
    Acceder a Bookish Online
{% endblock content_title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm">
            <h2 class="card-title text-center mb-4 text-primary">Iniciar Sesión</h2>
            
            <form action={% url 'login' %}  method='POST'>
                {% csrf_token %}
                {{ form|crispy }}
                
                <button type="submit" class="btn btn-success w-100 mt-3">Iniciar Sesión</button>
            </form>
            
            <hr>
            
            <p class="text-center mt-3">
                ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a>.
            </p>
            
        </div>
    </div>
</div>
{% endblock content %}
