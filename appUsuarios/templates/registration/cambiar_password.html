{% extends 'base.html' %}
{% load crispy_forms_tags %} 

{% block content_title %}
    Cambiar Contraseña
{% endblock content_title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h2 class="card-title text-center mb-4 text-info">
                Cambiar Contraseña
            </h2>
            <p class="text-muted text-center">
                Por seguridad, debes ingresar tu contraseña actual.
            </p>
            
            <form method="post">
                {% csrf_token %}
                
                {{ form|crispy }} 
                
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'inicio' %}" class="btn btn-secondary">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-info text-white">
                        Confirmar Cambio
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
