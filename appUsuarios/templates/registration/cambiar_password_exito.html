{% extends 'base.html' %}

{% block content_title %}
    Contraseña Cambiada
{% endblock content_title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
            <h2 class="mt-3">¡Contraseña Actualizada con Éxito!</h2>
            <p class="lead">
                Tu contraseña ha sido cambiada. Ya puedes usarla para iniciar sesión la próxima vez.
            </p>
            <a href="{% url 'inicio' %}" class="btn btn-primary mt-4">
                Volver al inicio
            </a>
        </div>
    </div>
</div>
{% endblock content %}
